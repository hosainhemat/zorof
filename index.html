<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ظرف من</title>
<meta name="theme-color" content="#4C6B5D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <button class="cart-btn" id="cartBtn" aria-label="سبد خرید">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6h15l-1.5 9h-12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/><path d="M2 3h2.2L6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    <span class="cart-count" id="cartCount">0</span>
  </button>
  <div class="brand">
    <span class="brand-mark">ظ</span>
    <span class="brand-name">ظرف من</span>
  </div>
  <button class="city-btn" id="cityBtn">
    <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 22s7-7.2 7-12.5A7 7 0 1 0 5 9.5C5 14.8 12 22 12 22Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9.5" r="2.2" fill="currentColor"/></svg>
    <span id="cityBtnLabel">انتخاب شهر</span>
  </button>
</header>

<!-- مودال انتخاب شهر -->
<div class="city-overlay" id="cityOverlay"></div>
<div class="city-modal" id="cityModal">
  <div class="city-modal-head">
    <h2>انتخاب شهر</h2>
    <button class="icon-btn" id="closeCityModal" aria-label="بستن">✕</button>
  </div>
  <button class="locate-btn" id="useLocationBtn">
    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    استفاده از موقعیت مکانی من (نزدیک‌ترین محصولات)
  </button>
  <input type="text" id="citySearch" class="field" placeholder="جستجوی شهر...">
  <div class="city-list" id="cityList"></div>
</div>

<section class="hero">
  <h1>ظرف مناسب برای هر سفره‌ای</h1>
  <p>از ظروف یک‌بارمصرف تا سرویس‌های کامل — انتخاب کنید، سفارش بدهید، تحویل بگیرید.</p>
</section>

<nav class="filters" id="filters"></nav>

<main class="grid" id="grid"></main>

<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-head">
    <h2>سبد خرید</h2>
    <button class="icon-btn" id="closeCart" aria-label="بستن">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <input type="tel" id="buyerPhone" class="field" placeholder="شماره تماس شما (برای هماهنگی ارسال)">
    <input type="text" id="buyerAddress" class="field" placeholder="آدرس تقریبی (اختیاری)">
    <div class="cart-total">
      <span>جمع کل</span>
      <span id="cartTotal">۰ تومان</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn">ثبت سفارش</button>
    <p class="cart-note">پرداخت آنلاین به‌زودی فعال می‌شود؛ سفارش شما برای تامین‌کننده نزدیک ارسال و برای هماهنگی با شما تماس گرفته می‌شود.</p>
  </div>
</aside>

<div class="toast" id="toast"></div>

<footer class="site-footer">
  <a href="supplier.html">پنل تامین‌کنندگان</a>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="cities.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
